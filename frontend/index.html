<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recruiter Platform</title>
    <link rel = "stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1> AI Recruiter Platform </h1>
    </header>
    <main>
        <section class="actions">
            <button id="jobs-button">Jobs</button>
            <button id="candidate-button">Add Candidate</button>
            <button id="create-job-button">Create Job</button>
        </section>
        <section class="ranking">
            <h2>Candidate Ranking</h2>
            <label for="job-select">Select Job</label>
            <select id="job-select">
                <option>Select a Job</option>
            </select>
            <table>
                <tr>
                    <th>Rank</th>
                    <th>Candidate</th>
                    <th>Score</th>
                    <th>Details</th>
                </tr>
            </table>

        </section>
    </main>
    <script src="script.js">
    </script>
</body>
</html>
